# The comment service in production, from the published image: PostgreSQL,
# a one-off migration, the HTTP server and the worker. Copy .env.example to
# .env next to this file and run `docker compose up -d`.
#
# On its own, the server listens on the host's loopback for a reverse proxy
# there; deploy/Caddyfile is its site block. Production runs in edge mode
# instead, behind the Caddy it shares with Explore and the identity service:
# COMPOSE_FILE in .env adds docker-compose.edge.yaml (docs/design/
# architecture.md section 9).
name: comments

x-backend: &backend
  image: ghcr.io/kite-plus/comments:${COMMENTS_VERSION:-latest}
  env_file: .env
  environment:
    COMMENTS_DATABASE_URL: postgres://comments:${POSTGRES_PASSWORD}@postgres:5432/comments?sslmode=disable
    # The reverse proxy reaches the server from this network; trusting it
    # lets the rate limits see the reader's address rather than the proxy's.
    COMMENTS_TRUSTED_PROXIES: ${COMMENTS_TRUSTED_PROXIES:-${COMMENTS_SUBNET:-10.90.0.0/24}}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comments
      POSTGRES_DB: comments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - comments-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "comments"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Not named serve: in edge mode it joins kite-edge, where Caddy also
  # resolves Explore's serve.
  server:
    <<: *backend
    command: ["serve"]
    restart: unless-stopped
    # Only on the host's loopback, for a reverse proxy there.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        # 10.90.1.0/24 for staging next to production.
        - subnet: ${COMMENTS_SUBNET:-10.90.0.0/24}

volumes:
  comments-db:
